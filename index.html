<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind and daisy Ui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Nature Zone</title>
</head>

<body>
    <h2 class="text-5xl text-center py-8 font bold">Choose Your Trees</h2>
    <!-- main section -->
    <main class="container mx-auto">

        <!-- Categories section -->
        <section class="w-11/12 mx-auto py-5">

        </section>

        <section class="grid grid-cols-12 justify-between gap-4">

            <!-- categories container -->
            <div class="shadow-2xl p-4 rounded-4xl bg-base-100 col-span-3">
                <h2 class="font-bold text-2xl">Categories</h2>
                <div class="py-5 space-y-3 sticky top-8">

                    <button id="allTreesBtn" class="btn btn-outline w-full">All Trees</button>
                    <!-- all trees container -->
                    <div id="categoriesContainer" class="space-y-3">
                        <!-- buttons will dynamically load here -->

                    </div>
                </div>
            </div>

            <!-- card functionalities section -->
            <div class="col-span-6">
                <!-- loading spinner -->
                <div id="loadingSpinner" class="h-[60vh] hidden justify-center items-center flex">
                    <span class="loading loading-spinner loading-xl"></span>
                </div>
                <div id="treesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Card will Dynamically will appear here -->
                </div>
            </div>

            <!-- cart section -->
            <div class="card bg-base-100 shadow-sm col-span-3">cart</div>


            <!-- card details -->
            <!-- Open the modal using ID.showModal() method -->
            <!-- <button class="btn" onclick="my_modal_1.showModal()">open modal</button> -->
            <dialog id="my_modal_1" class="modal">
                <div class="modal-box">
                    <!-- Modal header with close button -->
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="font-bold text-2xl text-green-600" id="modalTitle">Tree Details</h3>
                        <button class="btn btn-sm btn-circle btn-ghost"
                            onclick="document.getElementById('my_modal_1').close()">❌</button>
                    </div>
                    <!-- Modal Content -->
                    <div class="gap-6">
                        <img id="modalImage" src="" alt="plant" class="w-full object-cover rounded-lg mb-12">
                        <!-- Plant Details -->
                        <div class="">
                            <p class="text-sm text-gray-500 mb-2">
                                <span class="font-bold">Category:</span>
                                <span id="modalCategory" class="badge badge-primary"></span>
                            </p>
                            <p class="text-sm text-gray-600 mb-4">
                                <span id="modalDescription"></span>
                            </p>
                            <div class="flex items-baseline gap-2 mb-6">
                                <span class="text-3xl font-bold text-green-600">$<span id="modalPrice">0</span></span>
                            </div>
                        </div>
                    </div>
                    <div class="modal-action">
                        <form method="dialog">
                            <!-- if there is a button in form, it will close the modal -->
                            <button class="btn">Close</button>
                        </form>
                    </div>
                </div>
            </dialog>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
